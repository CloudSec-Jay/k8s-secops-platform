#cloud-config
hostname: ${hostname}
manage_etc_hosts: true
disable_root: true
ssh_pwauth: false

users:
  - name: ${vm_user}
    groups: [sudo]
    shell: /bin/bash
    # Lab trade-off: passwordless sudo lets Ansible run without a become
    # password. Login is key-only (lock_passwd, ssh_pwauth: false), so sudo
    # is reachable only by someone holding the lab SSH key.
    sudo: ALL=(ALL) NOPASSWD:ALL
    lock_passwd: true
    ssh_authorized_keys:
      - ${ssh_public_key}

packages:
  - qemu-guest-agent

runcmd:
  - [systemctl, enable, --now, qemu-guest-agent]
