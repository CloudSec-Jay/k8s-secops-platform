---
# Kubernetes node-preparation playbook.
#
# This playbook is designed to be safe to syntax-check and run repeatedly.
# It prepares nodes only; it does not run kubeadm init or join.

- name: Prepare the kubeadm nodes
  hosts: all
  become: true
  gather_facts: true

  vars:
    # Keep this aligned with the reviewed pin in ../../versions.env.
    kubernetes_minor: v1.37
    kubernetes_packages:
      - kubelet
      - kubeadm
      - kubectl
    kubernetes_kernel_modules:
      - overlay
      - br_netfilter
    kubernetes_sysctls:
      net.bridge.bridge-nf-call-iptables: "1"
      net.bridge.bridge-nf-call-ip6tables: "1"
      net.ipv4.ip_forward: "1"

  tasks:
    - name: Install containerd
      ansible.builtin.apt:
        name: containerd
        state: present
        update_cache: true
        cache_valid_time: 3600

    - name: Disable active swap
      ansible.builtin.command: swapoff --all
      when: ansible_facts["swaptotal_mb"] > 0
      changed_when: true

    - name: Disable swap entries at boot
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: '^(?!#)(\S+\s+\S+\s+swap\s+.*)$'
        replace: '# \1'
        backup: true

    - name: Load and persist kernel modules for Kubernetes
      community.general.modprobe:
        name: "{{ item }}"
        state: present
        persistent: present
      loop: "{{ kubernetes_kernel_modules }}"

    - name: Set kernel networking parameters for Kubernetes
      ansible.posix.sysctl:
        name: "{{ item.key }}"
        value: "{{ item.value }}"
        sysctl_file: /etc/sysctl.d/kubernetes.conf
        sysctl_set: true
        state: present
        reload: true
      loop: "{{ kubernetes_sysctls | dict2items }}"
      loop_control:
        label: "{{ item.key }}={{ item.value }}"

    # CHALLENGE 1 COMPLETE: Configure containerd for kubelet compatibility.
    - name: Create the containerd configuration directory
      ansible.builtin.file:
        path: /etc/containerd
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Generate the default containerd configuration once
      ansible.builtin.shell:
        cmd: containerd config default > /etc/containerd/config.toml
        creates: /etc/containerd/config.toml
      notify: Restart containerd

    - name: Use systemd cgroups in containerd
      ansible.builtin.replace:
        path: /etc/containerd/config.toml
        regexp: '^(\s*)SystemdCgroup\s*=\s*false$'
        replace: '\1SystemdCgroup = true'
      when: not ansible_check_mode
      notify: Restart containerd

    # CHALLENGE 2 COMPLETE: Configure the pinned Kubernetes package repository.
    #
    # Upstream source pattern:
    # https://pkgs.k8s.io/core:/stable:/<KUBERNETES_MINOR>/deb/
    #
    # Goal:
    # - Ensure /etc/apt/keyrings exists with mode 0755.
    # - Download the repository signing key from the pinned minor repository.
    # - Configure one signed-by APT source using kubernetes_minor.
    # - Refresh the APT cache only when the repository configuration changes.
    #
    - name: Create the APT keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the Kubernetes repository signing key
      ansible.builtin.get_url:
        url: "https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/Release.key"
        dest: /etc/apt/keyrings/kubernetes-apt-keyring.asc
        owner: root
        group: root
        mode: "0644"

    - name: Configure the pinned Kubernetes package repository
      ansible.builtin.apt_repository:
        repo: >-
          deb [signed-by=/etc/apt/keyrings/kubernetes-apt-keyring.asc]
          https://pkgs.k8s.io/core:/stable:/{{ kubernetes_minor }}/deb/ /
        filename: kubernetes
        state: present
        update_cache: true

    # CHALLENGE 3 COMPLETE: Install and hold the Kubernetes packages.
    #
    # Goal:
    # - Install every item in kubernetes_packages with state present.
    # - Prevent unintended upgrades of each Kubernetes package.
    # - Enable kubelet without claiming it should already be healthy; kubelet
    #   normally restart-loops until kubeadm supplies its configuration.
    #
    - name: Install the Kubernetes packages
      ansible.builtin.apt:
        name: "{{ kubernetes_packages }}"
        state: present

    - name: Hold the Kubernetes packages at their installed versions
      ansible.builtin.dpkg_selections:
        name: "{{ item }}"
        selection: hold
      loop: "{{ kubernetes_packages }}"

    - name: Enable kubelet for startup
      ansible.builtin.systemd_service:
        name: kubelet
        enabled: true

  handlers:
    - name: Restart containerd
      ansible.builtin.systemd_service:
        name: containerd
        state: restarted
        enabled: true
