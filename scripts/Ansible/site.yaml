---
# Master Kubernetes Platform Orchestrator
#
# Executes the full cluster bootstrap sequence in strict dependency order:
#   1. Prepare nodes (containerd, kernel modules, sysctls, kubelet/kubeadm)
#   2. Initialize control plane and join worker nodes
#   3. Install pinned Helm client binary
#   4. Deploy Cilium CNI with eBPF kube-proxy replacement
#   5. Configure dynamic persistent storage (local-path default StorageClass)
#
# Usage:
#   ansible-playbook site.yaml

- import_playbook: cluster-setup.yaml
- import_playbook: kubeadm-bootstrap.yaml
- import_playbook: helm-install.yaml
- import_playbook: cilium-install.yaml
- import_playbook: storage-setup.yaml

