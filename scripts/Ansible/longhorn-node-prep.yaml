---
# Prepare Longhorn storage on each worker. Safe to re-run.
#
# By default Longhorn keeps replicas in /var/lib/longhorn on the root
# filesystem. A worker with a spare disk can set longhorn_disk_device in its
# host_vars to a stable /dev/disk/by-id path; that disk is formatted ext4 if
# it has no filesystem, and any other filesystem stops the play instead of
# being overwritten.

- name: Prepare the Longhorn data disk on workers
  hosts: workers
  become: true
  gather_facts: false

  vars:
    longhorn_data_path: /var/lib/longhorn

  tasks:
    - name: Create the Longhorn data directory
      ansible.builtin.file:
        path: "{{ longhorn_data_path }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Prepare the dedicated Longhorn disk
      when: longhorn_disk_device is defined
      block:
        - name: Verify the Longhorn data disk is attached
          ansible.builtin.stat:
            path: "{{ longhorn_disk_device }}"
          register: longhorn_disk
          failed_when: not longhorn_disk.stat.exists

        - name: Create an ext4 filesystem on the Longhorn disk if it has none
          community.general.filesystem:
            dev: "{{ longhorn_disk_device }}"
            fstype: ext4

        - name: Read the Longhorn filesystem UUID
          ansible.builtin.command:
            cmd: blkid --match-tag UUID --output value {{ longhorn_disk_device }}
          register: longhorn_disk_uuid
          changed_when: false

        # nofail lets the worker boot if the disk is missing. Longhorn then
        # finds no disk config in the empty directory and marks the disk
        # unready rather than writing replicas to the OS disk.
        - name: Mount the Longhorn disk and persist it in fstab
          ansible.posix.mount:
            path: "{{ longhorn_data_path }}"
            src: "UUID={{ longhorn_disk_uuid.stdout }}"
            fstype: ext4
            opts: defaults,nofail
            state: mounted

    # Longhorn attaches volumes as iSCSI disks named /dev/sdX. Left alone,
    # multipathd claims them and pod mounts fail as "already mounted or mount
    # point busy". Worker system disks are NVMe (nvmeXnY) and stay managed.
    # A USB disk is also sdX and is ignored too, which is harmless because no
    # node uses multipath for real storage. A drop-in keeps the package-owned
    # /etc/multipath.conf untouched.
    # https://longhorn.io/kb/troubleshooting-volume-with-multipath/
    # A minimal install may not include multipath at all; the drop-in is
    # still written so it applies if device-mapper-multipath is added later.
    - name: Check whether multipathd is installed
      ansible.builtin.stat:
        path: /usr/sbin/multipathd
      register: multipathd_binary

    - name: Create the multipath drop-in directory
      ansible.builtin.file:
        path: /etc/multipath/conf.d
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Blacklist Longhorn iSCSI devices from multipath
      ansible.builtin.copy:
        dest: /etc/multipath/conf.d/longhorn.conf
        owner: root
        group: root
        mode: "0644"
        content: |
          blacklist {
              devnode "^sd[a-z0-9]+"
          }
      notify: Restart multipathd

  handlers:
    - name: Restart multipathd
      ansible.builtin.systemd_service:
        name: multipathd
        state: restarted
      when: multipathd_binary.stat.exists

# Runs after every worker is prepared, so Longhorn's node agents find the
# mounted disk on first start.
- name: Install Longhorn on the control plane
  hosts: control_plane[0]
  become: true
  gather_facts: false

  tasks:
    - name: Deploy or upgrade Longhorn via Helm
      kubernetes.core.helm:
        binary_path: "{{ helm_binary }}"
        name: longhorn
        chart_ref: longhorn
        chart_repo_url: https://charts.longhorn.io
        chart_version: "{{ longhorn_chart_version }}"
        release_namespace: longhorn-system
        create_namespace: true
        kubeconfig: /etc/kubernetes/admin.conf
        values:
          persistence:
            # One replica per worker; the chart default of 3 would leave
            # every volume degraded on a two-worker cluster.
            defaultClassReplicaCount: "{{ [groups['workers'] | length, 3] | min }}"
        wait: true
        timeout: "10m"
