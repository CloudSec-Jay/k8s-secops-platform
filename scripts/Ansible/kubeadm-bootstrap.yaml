---
- name: Initialize the control plane
  hosts: control_plane
  become: true
  tasks:
    - name: Create the kubeadm patches directory
      ansible.builtin.file:
        path: /etc/kubernetes/patches
        state: directory
        owner: root
        group: root
        mode: "0700"

    # With enable_selinux in containerd, static pods run as container_t,
    # which container-selinux denies reading kubernetes_file_t (the PKI and
    # kubeconfigs). Workload pods stay container_t.
    - name: Run the control-plane static pods as spc_t
      ansible.builtin.copy:
        dest: "/etc/kubernetes/patches/{{ item }}.yaml"
        owner: root
        group: root
        mode: "0600"
        content: |
          spec:
            securityContext:
              seLinuxOptions:
                type: spc_t
      loop:
        - etcd
        - kube-apiserver
        - kube-controller-manager
        - kube-scheduler

    - name: Kubernetes init template
      ansible.builtin.template:
        src: kubeadm-config.yaml.j2
        dest: /etc/kubernetes/kubeadm-config.yaml
        owner: root
        group: root
        mode: '0600'

    - name: Kubernetes config validation
      ansible.builtin.command:
        cmd: kubeadm config validate --config /etc/kubernetes/kubeadm-config.yaml
      changed_when: false

    # kubeadm writes admin.conf early in init, so its presence does not prove
    # init finished. Only a serving API server does.
    - name: Check whether the API server is already serving
      ansible.builtin.command:
        cmd: kubectl --kubeconfig /etc/kubernetes/admin.conf get --raw=/readyz
      register: apiserver_readyz
      changed_when: false
      failed_when: false

    - name: Check for leftovers from a failed init
      ansible.builtin.stat:
        path: /etc/kubernetes/admin.conf
      register: admin_conf

    - name: Stop on a half-finished init
      ansible.builtin.fail:
        msg: >-
          admin.conf exists but the API server is not serving. Fix the cause,
          run `sudo kubeadm reset -f` on {{ inventory_hostname }}, then re-run.
      when: apiserver_readyz.rc != 0 and admin_conf.stat.exists

    - name: Initialize the Kubernetes control-plane
      ansible.builtin.command:
        cmd: kubeadm init --config /etc/kubernetes/kubeadm-config.yaml
      when: apiserver_readyz.rc != 0
      changed_when: true

    - name: Create the kubectl configuration directory
      ansible.builtin.file:
        path: /home/{{ ansible_user }}/.kube
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0700'

    - name: Copy the administrator kubeconfig for the Ansible user
      ansible.builtin.copy:
        src: /etc/kubernetes/admin.conf
        dest: /home/{{ ansible_user }}/.kube/config
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: '0600'

    - name: Generate the worker join command
      ansible.builtin.command:
        cmd: kubeadm token create --print-join-command
      register: kubeadm_join_command
      changed_when: false

- name: Join worker nodes to the cluster
  hosts: workers
  become: true
  tasks:
    - name: Join the Kubernetes cluster
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['control_plane'][0]]['kubeadm_join_command']['stdout'] }}"
        creates: /etc/kubernetes/kubelet.conf
