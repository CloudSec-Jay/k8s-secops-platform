<ossec_config>
  <client>
    <server>
      <address>wazuh-manager.lab.internal</address>
      <port>1514</port>
      <protocol>tcp</protocol>
    </server>
    <enrollment>
      <enabled>yes</enabled>
    </enrollment>
  </client>

  <logging>
    <log_format>plain</log_format>
  </logging>

  <localfile>
    <log_format>journald</log_format>
    <location>journald</location>
  </localfile>

  <localfile>
    <log_format>audit</log_format>
    <location>/var/log/audit/audit.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/messages</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/secure</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/dnf.log</location>
  </localfile>

  <localfile>
    <log_format>syslog</log_format>
    <location>/var/log/cron</location>
  </localfile>

  <syscheck>
    <disabled>no</disabled>
    <frequency>43200</frequency>
    <scan_on_start>yes</scan_on_start>

    <!-- whodata provider — auditd captures changed_fields + perm required by linux_fim_rules.xml -->
    <whodata>
      <provider>auditd</provider>
      <queue_size>50000</queue_size>
      <restart_audit>yes</restart_audit>
      <audit_key>wazuh_fim</audit_key>
    </whodata>

    <directories check_all="yes" realtime="yes" whodata="yes">/etc,/root</directories>
    <directories check_all="yes">/usr/bin,/usr/sbin,/bin,/sbin</directories>
    <directories check_all="yes" realtime="yes" whodata="yes">/etc/audit,/etc/ssh,/etc/pam.d,/etc/sudoers.d</directories>
    <directories check_all="yes" realtime="yes">/tmp,/var/tmp,/dev/shm</directories>
    <ignore>/etc/mtab</ignore>
    <ignore>/etc/mnttab</ignore>
    <ignore>/tmp/claude-1000</ignore>
    <ignore>/tmp/python-languageserver-cancellation</ignore>
    <ignore>/tmp/gdk-pixbuf-glycin-tmp</ignore>
    <ignore>/tmp/node-compile-cache</ignore>
    <ignore>/tmp/aws-toolkit-vscode</ignore>
    <ignore>/tmp/gemini</ignore>
    <ignore>/tmp/hsperfdata_jayadmin</ignore>
    <ignore type="sregex">^/dev/shm/.org.chromium</ignore>
    <ignore>/etc/hosts.deny</ignore>
    <!-- systemd runtime property overrides — written by systemctl set-property, not persistence paths -->
    <ignore>/etc/systemd/system.control</ignore>
    <!-- lttng-ust shared memory rendezvous files — process-lifetime objects in tmpfs, cleared on reboot -->
    <ignore type="sregex">^/dev/shm/lttng-ust-</ignore>
    <!-- Firefox session lock files — browser PID locks, not staging artifacts -->
    <ignore>/tmp/org.mozilla.firefox</ignore>
  </syscheck>

  <wodle name="syscollector">
    <disabled>no</disabled>
    <interval>1h</interval>
    <packages>yes</packages>
    <os>yes</os>
    <hotfixes>yes</hotfixes>
  </wodle>

  <rootcheck>
    <disabled>no</disabled>
  </rootcheck>

  <sca>
    <enabled>yes</enabled>
    <scan_on_start>yes</scan_on_start>
    <interval>12h</interval>
    <skip_nfs>yes</skip_nfs>
    <policies>
      <policy>etc/shared/cis_fedora_custom.yaml</policy>
      <policy>/var/ossec/ruleset/sca/cis_distribution_independent_linux.yml</policy>
    </policies>
  </sca>

</ossec_config>
