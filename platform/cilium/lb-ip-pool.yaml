# LoadBalancer IPs for opted-in Services, taken from the home LAN
# (10.0.0.0/24). The home router's DHCP range must not include this block.
apiVersion: cilium.io/v2
kind: CiliumLoadBalancerIPPool
metadata:
  name: lan-services
spec:
  blocks:
    - start: "10.0.0.240"
      stop: "10.0.0.250"
  serviceSelector:
    matchLabels:
      lab.internal/expose: lan
