kubeProxyReplacement: true

operator:
  replicas: 1

hubble:
  relay:
    enabled: true
  ui:
    enabled: true
  metrics:
    enabled:
      - dns
      - drop
      - flow
      - httpV2
      - icmp
      - port-distribution
      - tcp

ipam:
  mode: kubernetes

l2announcements:
  enabled: true

rollOutCiliumPods: true

securityContext:
  privileged: false

cgroup:
  autoMount:
    enabled: true
  hostRoot: /run/cilium/cgroupv2
