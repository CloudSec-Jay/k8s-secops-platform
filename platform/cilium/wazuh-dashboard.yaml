# The UI is open to the home LAN only; the Service's 443 maps to pod port
# 5601. kubectl port-forward enters through the pod's network namespace and
# is not subject to this policy.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: wazuh-dashboard
  namespace: wazuh
spec:
  endpointSelector:
    matchLabels:
      app: wazuh-dashboard
  ingress:
    - fromCIDR:
        - 10.0.0.0/24
      toPorts:
        - ports:
            - port: "5601"
              protocol: TCP
  egress:
    - toEndpoints:
        - matchLabels:
            app: wazuh-indexer
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
    - toEndpoints:
        - matchLabels:
            app: wazuh-manager
            node-type: master
      toPorts:
        - ports:
            - port: "55000"
              protocol: TCP
