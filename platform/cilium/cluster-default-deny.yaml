# Cluster-wide baseline: every endpoint in every namespace, including ones
# created later, denies traffic unless another policy allows it. Apply last,
# after kube-system-allow.yaml and local-path-storage-allow.yaml.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: default-deny
spec:
  endpointSelector: {}
  ingress:
    - {}
  egress:
    - {}
---
# cilium-health endpoints probe each other between nodes; without this the
# default deny above breaks Cilium's own connectivity health checks.
apiVersion: cilium.io/v2
kind: CiliumClusterwideNetworkPolicy
metadata:
  name: cilium-health
spec:
  endpointSelector:
    matchLabels:
      reserved:health: ""
  ingress:
    - fromEntities:
        - host
        - remote-node
        - health
  egress:
    - toEntities:
        - host
        - remote-node
        - health
