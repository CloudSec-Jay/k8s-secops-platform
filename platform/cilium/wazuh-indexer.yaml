# Single-node indexer: accepts REST from the dashboard and managers and
# opens no outbound connections.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: wazuh-indexer
  namespace: wazuh
spec:
  endpointSelector:
    matchLabels:
      app: wazuh-indexer
  ingress:
    - fromEndpoints:
        - matchLabels:
            app: wazuh-dashboard
        - matchLabels:
            app: wazuh-manager
      toPorts:
        - ports:
            - port: "9200"
              protocol: TCP
